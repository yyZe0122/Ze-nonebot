[project]
name = "nonebot"
version = "0.1.0"
description = "NoneBot2 skeleton connected to LLBot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "nonebot2[fastapi,httpx]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "pyyaml>=6",
    "websockets>=15",
    "pillow>=13,<14",
    "fastembed>=0.9.1,<0.10",
    "tzdata; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.nonebot]
plugins = ["src.plugins.persona_agent.plugin"]
builtin_plugins = []
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
